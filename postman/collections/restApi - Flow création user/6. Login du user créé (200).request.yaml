$kind: http-request
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('Un token est renvoyé', () => pm.expect(body.token).to.be.a('string'));
      pm.collectionVariables.set('token', body.token);
    language: text/javascript
order: 6000
