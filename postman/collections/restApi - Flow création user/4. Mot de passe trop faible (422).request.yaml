$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "faible{{$timestamp}}@defense.fr",
      "password": "azerty"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 422', () => pm.response.to.have.status(422));
      pm.test('Erreur sur le champ password', () => {
          const fields = pm.response.json().detail.map(e => e.path);
          pm.expect(fields).to.include('password');
      });
    language: text/javascript
order: 4000
